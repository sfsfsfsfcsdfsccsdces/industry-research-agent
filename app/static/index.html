<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InsightForge · 智能调研 Agent</title>
  <style>
    :root { --bg:#07111f; --panel:#0d1b2c; --line:#203550; --text:#e9f1fb; --muted:#94a8bf; --primary:#36d1b4; --primary2:#5c8cff; --danger:#ff6b7a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 12% 0,#123355 0,transparent 32%),var(--bg); color:var(--text); min-height:100vh; }
    .shell { max-width:1180px; margin:auto; padding:32px 22px 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:42px; height:42px; border-radius:13px; display:grid; place-items:center; background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#06121c; font-weight:900; }
    h1 { margin:0; font-size:22px; } .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .pill { border:1px solid #2c5970; background:#0d2934; color:#71e7d2; padding:7px 11px; border-radius:999px; font-size:12px; }
    .grid { display:grid; grid-template-columns:360px 1fr; gap:22px; align-items:start; }
    .card { background:rgba(13,27,44,.94); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.2); }
    .setup { padding:20px; position:sticky; top:20px; } .output { min-height:600px; overflow:hidden; }
    label { display:block; font-size:13px; color:#b8c8d9; margin:16px 0 8px; }
    textarea,select,input[type=file] { width:100%; border:1px solid #29415c; border-radius:11px; background:#081523; color:var(--text); padding:12px; outline:none; }
    textarea { resize:vertical; min-height:125px; line-height:1.55; }
    textarea:focus,select:focus { border-color:var(--primary); }
    button { width:100%; margin-top:18px; border:0; border-radius:11px; padding:13px 16px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--primary),#45b7da); color:#06151d; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .upload { background:transparent; color:#a9bdd2; border:1px solid #29415c; margin-top:9px; padding:9px; }
    .hint { color:var(--muted); font-size:12px; line-height:1.6; margin-top:16px; }
    .output-head { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .progress-wrap { padding:20px 22px; border-bottom:1px solid var(--line); }
    .progress { height:7px; background:#17283c; border-radius:20px; overflow:hidden; }
    .bar { width:0; height:100%; background:linear-gradient(90deg,var(--primary),var(--primary2)); transition:width .35s ease; }
    .status { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:10px; }
    .timeline { padding:0 22px 18px; max-height:175px; overflow:auto; }
    .event { display:grid; grid-template-columns:8px 1fr auto; gap:10px; align-items:center; font-size:12px; color:#aebfd0; padding-top:10px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--primary); }
    .report { padding:25px 30px 50px; line-height:1.78; color:#d9e5f1; }
    .report h1,.report h2,.report h3 { color:#f5f9ff; margin-top:1.4em; } .report h1 { font-size:25px; } .report h2 { font-size:19px; border-bottom:1px solid #21364e; padding-bottom:7px; }
    .report table { width:100%; border-collapse:collapse; font-size:13px; display:block; overflow:auto; } .report th,.report td { border:1px solid #2a4058; padding:8px; text-align:left; } .report a { color:#58d7c3; }
    .empty { padding:110px 30px; text-align:center; color:var(--muted); } .empty b { display:block; color:#d6e4f2; font-size:18px; margin-bottom:8px; }
    .downloads { display:none; gap:8px; } .downloads a { color:#96eadb; border:1px solid #2b5c64; padding:6px 9px; border-radius:8px; font-size:12px; text-decoration:none; }
    @media(max-width:850px){ .grid{grid-template-columns:1fr}.setup{position:static}header{align-items:flex-start}.pill{display:none} }
  </style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><div class="logo">IF</div><div><h1>InsightForge 智能调研 Agent</h1><div class="sub">行业研究 · 竞品分析 · 多源 RAG · 可追溯报告</div></div></div>
    <span class="pill" id="mode-pill">检测运行模式…</span>
  </header>
  <section class="grid">
    <aside class="card setup">
      <label for="query">调研目标</label>
      <textarea id="query">对比 Dify、FastGPT 与 RAGFlow 的产品定位、核心能力和适用场景，并给出企业知识库选型建议</textarea>
      <label for="mode">资料范围</label>
      <select id="mode"><option value="hybrid">混合检索（网页 + 本地文档）</option><option value="web">仅网页检索</option><option value="local">仅本地文档</option></select>
      <button id="run">开始深度调研</button>
      <label for="file">补充企业内部资料（可选）</label>
      <input id="file" type="file" accept=".pdf,.docx,.md,.txt,.csv">
      <button class="upload" id="upload">上传文档</button>
      <div class="hint">无 API Key 时自动使用内置公开样例，仍可演示规划、检索、重排、引用校验和三种格式导出。</div>
    </aside>
    <article class="card output">
      <div class="output-head"><strong>研究工作台</strong><div class="downloads" id="downloads"></div></div>
      <div class="progress-wrap" id="progress-wrap" hidden><div class="progress"><div class="bar" id="bar"></div></div><div class="status"><span id="step">准备中</span><span id="percent">0%</span></div></div>
      <div class="timeline" id="timeline"></div>
      <div class="empty" id="empty"><b>输入一个真实的业务问题</b>Agent 会拆解问题、检索证据并生成带引用的结构化报告。</div>
      <div class="report" id="report"></div>
    </article>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const escapeHtml = text => text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderMarkdown(md){
  let html=escapeHtml(md);
  html=html.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  html=html.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  html=html.replace(/^\|(.+)\|\n\|[-:| ]+\|\n((?:\|.*\|\n?)*)/gm,(all,head,body)=>{const th=head.split('|').map(x=>`<th>${x.trim()}</th>`).join('');const rows=body.trim().split('\n').map(r=>'<tr>'+r.slice(1,-1).split('|').map(x=>`<td>${x.trim()}</td>`).join('')+'</tr>').join('');return `<table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table>`});
  html=html.replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(?:<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  html=html.replace(/^(\d+)\. (.*)$/gm,'<div><strong>$1.</strong> $2</div>');
  return html.split(/\n{2,}/).map(block=>/^<(h\d|ul|table|div)/.test(block)?block:`<p>${block.replace(/\n/g,'<br>')}</p>`).join('');
}
function addEvent(message,progress){const div=document.createElement('div');div.className='event';div.innerHTML=`<span class="dot"></span><span>${escapeHtml(message)}</span><span>${progress}%</span>`;$('timeline').append(div);$('timeline').scrollTop=$('timeline').scrollHeight;$('bar').style.width=progress+'%';$('percent').textContent=progress+'%';$('step').textContent=message;}
async function loadHealth(){try{const h=await fetch('/api/health').then(r=>r.json());$('mode-pill').textContent=h.mode==='demo'?'演示模式 · 无需密钥':'实时模式 · Tavily + LLM';}catch(e){$('mode-pill').textContent='服务未连接';}}
$('upload').onclick=async()=>{const file=$('file').files[0];if(!file)return alert('请先选择文件');const form=new FormData();form.append('file',file);const res=await fetch('/api/documents',{method:'POST',body:form});const data=await res.json();alert(res.ok?data.message:(data.detail||'上传失败'));};
$('run').onclick=async()=>{const query=$('query').value.trim();if(query.length<3)return alert('请输入至少 3 个字的调研目标');$('run').disabled=true;$('empty').hidden=true;$('report').innerHTML='';$('timeline').innerHTML='';$('downloads').style.display='none';$('progress-wrap').hidden=false;addEvent('正在创建研究任务',2);
  try{const res=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,mode:$('mode').value})});if(!res.ok)throw new Error((await res.json()).detail||'创建失败');const task=await res.json();const es=new EventSource(`/api/research/${task.id}/events`);es.addEventListener('progress',e=>{const d=JSON.parse(e.data);addEvent(d.message,d.progress)});es.addEventListener('complete',async()=>{es.close();const data=await fetch(`/api/research/${task.id}`).then(r=>r.json());$('report').innerHTML=renderMarkdown(data.report.markdown);$('downloads').innerHTML=['md','docx','pdf'].map(f=>`<a href="/api/research/${task.id}/download/${f}">${f.toUpperCase()}</a>`).join('');$('downloads').style.display='flex';$('run').disabled=false;});es.addEventListener('error',()=>{es.close();addEvent('任务异常，请查看服务日志',100);$('run').disabled=false;});}
  catch(e){alert(e.message);$('run').disabled=false;}
};
loadHealth();
</script>
</body>
</html>
